# Blueprint de Render para Clínica Témpora.

services:
  - type: web
    runtime: static
    name: tempora-implante-capilar
    rootDir: astro
    buildCommand: npm run render-build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Variables públicas por diseño: la seguridad está en RLS de Supabase.
      - key: PUBLIC_SUPABASE_URL
        sync: false
      - key: PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: PUBLIC_SUPABASE_TABLE
        value: leads
    headers:
      - path: /CMS/*
        name: X-Robots-Tag
        value: noindex, nofollow, noarchive
      - path: /CMS/*
        name: Cache-Control
        value: no-store
      - path: /CMS/*
        name: X-Frame-Options
        value: DENY
      - path: /CMS/*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /_astro/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=604800
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin

  # Sitio vanilla heredado; se conserva sin cambios funcionales.
  - type: web
    runtime: static
    name: tempora-implante-capilar-vanilla
    buildCommand: echo "sin build: se sirve tal cual"
    staticPublishPath: vanilla
    autoDeploy: true
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=604800
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
